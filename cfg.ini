[Service]
Host = 0.0.0.0
Port = 5001
; 10-debug, 20-info, 30-warning, 40-error, 50-critical
LogLevel = 20

[Monitor]
; 监控目标URL
TargetUrl = https://www.pandaai.online/pandaApi/arena/api/trades
; 默认模型代码
DefaultModelCode = pandaai
; 默认页码
DefaultPage = 1
; 默认每页数量
DefaultLimit = 50
; 定时监控间隔（秒）
DefaultIntervalSeconds = 300
; 是否在启动时自动开启定时监控
AutoStartScheduler = true
; 是否在启动时推送最近的交易记录
AutoPushOnStartup = true
; 启动时推送的交易条数
StartupPushCount = 5

[WeChat]
; 企业微信机器人Access Token
Access_Token = af900beb-69f2-4432-9741-afff0cb73bff
; 群名称（用于非生产环境标识）
Access_name = Dev_IT_Notification
; @提醒的人（可选，多个人用空格分隔）
At_person =
; 是否启用企业微信推送
Enabled = true
